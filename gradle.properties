# gradle.properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Forzar JDK 21 para que Kotlin 2.0.21 no choque con el JBR 25 de Android Studio.
# El JBR 25 (java version "25.0.2") parsea mal con Kotlin 2.0.21.
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.12.8-hotspot

# Suprimir warning de AGP 8.7.3 que fue testeado hasta compileSdk 35.
# (Android Studio 2026.1 ya trae AGP 8.8+ que soporta SDK 36 nativamente.)
android.suppressUnsupportedCompileSdk=36

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
