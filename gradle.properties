# gradle.properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Forzar JDK 21 LTS (ultimo LTS maduro al 2026-08-02).
# JDK 25 existe (sept 2025) pero no es LTS y el proyecto no lo necesita.
# Compatible con AGP 8.9+ y Kotlin 2.1.20+.
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.12.8-hotspot

# AGP 8.9.2 soporta SDK 36 nativamente, no necesita suprimir el warning.
# (android.suppressUnsupportedCompileSdk=36 ya no es necesario.)

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
